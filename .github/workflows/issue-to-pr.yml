name: Approved issue to PR

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Open issue number approved for implementation
        required: true
        type: string

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: issue-to-pr-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  solve:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'copilot-approved'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    environment: copilot-demo
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate maintainer approval
        run: node scripts\remote-issue.mjs authorize
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
      - name: Install verified CLI version
        run: |
          npm install --global @github/copilot@1.0.96-2
          if ($LASTEXITCODE -ne 0) { throw 'Copilot installation failed' }
          $globalRoot = npm root --global
          $binary = node --input-type=module -e "import {createRequire} from 'node:module'; import path from 'node:path'; process.stdout.write(createRequire(path.join(process.argv[1], '@github', 'copilot', 'npm-loader.js')).resolve('@github/copilot-win32-x64'));" $globalRoot
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $binary)) { throw 'Native Copilot binary not found' }
          "COPILOT_CLI_PATH=$binary" >> $env:GITHUB_ENV
      - name: Register the issue-to-pr skill
        run: copilot skill add .\skills
      - name: Solve the approved issue and open a PR
        run: node scripts\solve-issue.mjs "https://github.com/${{ github.repository }}/issues/${{ github.event.issue.number || inputs.issue }}"
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          GITHUB_COPILOT_PROMPT_MODE_EXTENSIONS: 'true'
